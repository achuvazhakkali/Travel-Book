<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adimaly Chapter - Our Love Story in Travels</title>
    <!-- Romantic, elegant fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf6f2; /* Soft warm ivory */
            --text-color: #4a403b;
            --accent-color: #b57c74; /* Romantic dusty rose */
            --border-color: #ebdcd3;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            min-height: 100vh;
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* Left Fixed Sidebar ('Our Story') */
        aside.left-sidebar {
            width: 380px;
            background-image: linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.88)), url('sidebar bg.jpg');
            background-size: cover;
            background-position: center;
            border-right: 1px solid var(--border-color);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 15px rgba(181, 124, 116, 0.04);
            z-index: 10;
        }

        /* Right Fixed Sidebar ('Forever') */
        aside.right-sidebar {
            width: 380px;
            background-image: linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.88)), url('side bar right bg.jpg');
            background-size: cover;
            background-position: center;
            border-left: 1px solid var(--border-color);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: fixed;
            top: 0;
            right: 0;
            height: 100vh;
            overflow-y: auto;
            box-shadow: -2px 0 15px rgba(181, 124, 116, 0.04);
            z-index: 10;
        }

        .book-title {
            text-align: center;
        }

        .book-title h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            font-weight: 600;
            font-style: italic;
            color: #382e2a;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .book-title p {
            font-size: 0.75rem;
            color: #000000;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-chapters {
            margin-top: 30px;
            text-align: center;
        }

        .nav-chapters h3 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #000000;
            margin-bottom: 15px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.9);
        }

        .nav-chapters ul {
            list-style: none;
        }

        .nav-chapters li {
            margin-bottom: 12px;
        }

        .nav-chapters .chapter-text {
            text-decoration: none;
            color: #8a4f44;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            display: inline-block;
        }

        .footer-note {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            color: #8c7e77;
            font-style: italic;
            text-align: center;
        }

        /* Middle Scrolling Area */
        main {
            margin-left: 380px;
            margin-right: 380px;
            flex: 1;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            min-height: 180vh;
        }

        /* Chapter Card Styling with Reverse Peel Animation Support */
        .chapter {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 3px 3px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(181, 124, 116, 0.05);
            position: relative;
            width: 550px;
            height: 650px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform-origin: bottom right;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 1s ease, box-shadow 1.2s ease;
        }

        .chapter.peel-back {
            transform: rotate(25deg) translate(100%, 50%) skewX(-15deg);
            opacity: 0;
            pointer-events: none;
            box-shadow: 30px -30px 50px rgba(0,0,0,0.25);
        }
